name: ICAI MCS watcher

on:
  schedule:
    - cron: "7 * * * *"   # tries to start a new run every hour; only one runs at a time
  workflow_dispatch:       # lets you start it by hand from the Actions tab

concurrency:
  group: icai-watcher
  cancel-in-progress: false  # never kill the running watcher; the next one waits its turn

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run watcher
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_MINUTES: "345"
        run: python icai_cloud_watcher.py
